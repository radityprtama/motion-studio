[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motion-studio"
version = "0.1.0"
description = "Deterministic programmable portrait motion graphics"
requires-python = ">=3.12"
dependencies = ["cairocffi>=1.7,<2", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
motion = "motion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/motion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
